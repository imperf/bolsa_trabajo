{% extends 'empleos/base.html' %}
{% block title %}Editar Empresa - Admin{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <a href="{% url 'admin_empresas' %}" class="text-blue-600 hover:text-blue-800">← Volver a Empresas</a>
        <h1 class="text-3xl font-bold text-gray-800 mt-4 mb-6">🏢 Editar Empresa: {{ empresa.nombre }}</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="grid md:grid-cols-2 gap-5">
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Nombre</label>
                    <input type="text" name="nombre" value="{{ empresa.nombre }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" name="correo" value="{{ empresa.correo }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Teléfono</label>
                    <input type="text" name="telefono" value="{{ empresa.telefono }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Sector</label>
                    <input type="text" name="sector" value="{{ empresa.sector }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Persona de Contacto</label>
                    <input type="text" name="persona_contacto" value="{{ empresa.persona_contacto }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">Sitio Web</label>
                    <input type="url" name="sitio_web" value="{{ empresa.sitio_web|default_if_none:'' }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">Dirección</label>
                <input type="text" name="direccion" value="{{ empresa.direccion }}" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Descripción</label>
                <textarea name="descripcion" rows="4" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ empresa.descripcion }}</textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">💾 Guardar Cambios</button>
                <a href="{% url 'admin_empresas' %}" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-bold transition text-center">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
