{% extends 'empleos/base.html' %}
{% block title %}Crear Categoría{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto py-12 px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <a href="{% url 'admin_categorias' %}" class="text-blue-600 hover:text-blue-800">← Volver</a>
        <h1 class="text-3xl font-bold text-gray-800 mt-4 mb-6">➕ Crear Nueva Categoría</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Nombre de la Categoría</label>
                <input type="text" name="nombre" placeholder="Ej: Tecnología, Marketing..." class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition">Crear Categoría</button>
        </form>
    </div>
</div>
{% endblock %}
